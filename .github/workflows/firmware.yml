name: Firmware regression and board builds
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    strategy:
      fail-fast: false
      matrix:
        board: [amoled_1_75, lcd_2_8c]
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build pinned firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B "build-${{ matrix.board }}" -DPRINTSPHERE_HW_VARIANT=${{ matrix.board }} build
      - name: Run host regression tests
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/test_host.py
      - name: Run actual LVGL UI regressions for both layouts
        if: matrix.board == 'amoled_1_75'
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/test_lvgl_host.py
